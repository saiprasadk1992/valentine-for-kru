<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Forever Valentine ❤️</title>

<style>
body{
  margin:0;
  font-family: system-ui, Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
  overflow:hidden;
}

/* blurred fullscreen background */
.bg{
  position:fixed;
  inset:0;
  z-index:-6;
  background-position:center;
  background-size:cover;
  filter: blur(18px) brightness(0.7);
}

/* sharp centered image */
.bgCenter{
  position:fixed;
  inset:0;
  z-index:-5;
  background-position:center;
  background-repeat:no-repeat;
  background-size:contain;
}

/* glass card */
.card{
  width:min(650px,92vw);
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(12px);
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
  text-align:center;
}

.answers button{
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  border-radius:12px;
  border:none;
  font-size:16px;
  cursor:pointer;
}

.next{
  margin-top:10px;
  padding:12px 20px;
  border:none;
  border-radius:20px;
  background:#ff4d6d;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.finalWrap{
  position:relative;
  height:200px;
}

.yes{
  padding:12px 25px;
  background:#ff4d6d;
  border:none;
  color:white;
  border-radius:20px;
}

.no{
  position:absolute;
  left:50%;
  top:50%;
  padding:12px 25px;
  background:#ccc;
  border:none;
  border-radius:20px;
}

.toast{
  margin-top:15px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="bg" id="bgBlur"></div>
<div class="bgCenter" id="bg"></div>

<div class="card" id="card">
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
<button class="next" id="nextBtn">Next ➜</button>
<div class="toast" id="toast"></div>
</div>

<script>

/* background slideshow */
const bg = document.getElementById("bg");
const bgBlur = document.getElementById("bgBlur");

const photos = [
"photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg","photo5.jpg",
"photo6.jpg","photo7.jpg","photo8.jpg","photo9.jpg","photo10.jpg",
"photo11.jpg","photo12.jpg","photo13.jpg","photo14.jpg","photo15.jpg"
];

let bi=0;
function setBg(){
  bg.style.backgroundImage=`url("${photos[bi]}")`;
  bgBlur.style.backgroundImage=`url("${photos[bi]}")`;
  bi=(bi+1)%photos.length;
}
setBg();
setInterval(setBg,6000);


/* quiz questions */
const questions=[
{q:"Where did our magical story begin?",a:["Gare de Lyon","CDG Airport","Sarvana Bhavan","Gare du Nord"],correct:3},
{q:"How many countries have we travelled together (excluding France & Norway)?",a:["10","8","9","7"],correct:1},
{q:"How many months are we together?",a:["33","32","35","30"],correct:1},
{q:"Who said I love you first?",a:["SP","SP","SP","SP"],correct:0},
{q:"Who is more romantic and caring?",a:["SP","SP","SP","SP"],correct:0}
];

let i=0;
let answered=false;

const qEl=document.getElementById("question");
const aEl=document.getElementById("answers");
const toast=document.getElementById("toast");
const nextBtn=document.getElementById("nextBtn");

function load(){
 qEl.innerHTML=questions[i].q;
 aEl.innerHTML="";
 answered=false;
 toast.innerHTML="";

 questions[i].a.forEach((txt,idx)=>{
   const b=document.createElement("button");
   b.innerHTML=txt;
   b.onclick=()=>{
     answered=true;
     toast.innerHTML="Good choice ❤️";
   };
   aEl.appendChild(b);
 });
}

function next(){
 i++;
 if(i<questions.length) load();
 else finalScreen();
}

nextBtn.onclick=()=>{
 if(!answered){toast.innerHTML="Choose an answer first 😊";return;}
 next();
};

function finalScreen(){
 document.getElementById("card").innerHTML=`
 <h2>From Paris to Trondheim… you are my forever ❤️</h2>
 <h3>Will you be my Valentine?</h3>
 <div class="finalWrap">
 <button class="yes" onclick="alert('She said YES ❤️')">YES</button>
 <button class="no" id="noBtn">NO</button>
 </div>
 `;

 const no=document.getElementById("noBtn");
 no.addEventListener("mouseover",()=>moveNo(no));
 no.addEventListener("click",()=>moveNo(no));
}

function moveNo(btn){
 btn.style.left=Math.random()*80+"%";
 btn.style.top=Math.random()*80+"%";
}

load();

</script>
</body>
</html>
