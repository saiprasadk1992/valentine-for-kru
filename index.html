<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Krutika ❤️</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    text-align:center;
    color:white;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background-size:cover;
    background-position:center;
    transition:background-image 1.5s ease-in-out;
}

.container{
    background: rgba(0,0,0,0.45);
    padding:40px;
    border-radius:20px;
}

button{
    padding:12px 25px;
    font-size:18px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.yes{background:#ff4d6d;color:white;}
.no{background:#cccccc;}

#message{
    margin-top:25px;
    font-size:22px;
    font-weight:bold;
    min-height:40px;
}
</style>
</head>

<body>

<div class="container">
<h1>From Trondheim to Paris ❤️</h1>
<p>Even across countries, my heart has always stayed with you.</p>

<h2>Krutika, will you be my forever Valentine?</h2>

<button class="yes" onclick="showMessage()">YES ❤️</button>
<button class="no" onclick="moveNo(this)">No</button>

<div id="message"></div>
</div>

<script>
const images = [
"images/photo1.jpg",
"images/photo2.jpg",
"images/photo3.jpg",
"images/photo4.jpg",
"images/photo5.jpg"
];

let i=0;
function changeBg(){
  document.body.style.backgroundImage = `url('${images[i]}')`;
  i = (i+1) % images.length;
}
changeBg();
setInterval(changeBg,5000);

function showMessage(){
  document.getElementById("message").innerHTML =
  "Distance never mattered — Paris or Trondheim — because my home has always been wherever you are ❤️";
}

function moveNo(btn){
  btn.style.position='absolute';
  btn.style.top=Math.random()*80+'%';
  btn.style.left=Math.random()*80+'%';
}
</script>

</body>
</html>
